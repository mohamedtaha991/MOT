<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مستكشف الحوادث الجغرافي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
<style>
  :root {
    --bg:#0E1217;
    --bg-panel:#161B22;
    --bg-panel-2:#1C232C;
    --border:#2A323C;
    --border-soft:#20272F;
    --text:#EDF0F3;
    --text-muted:#8B94A3;
    --text-faint:#5B6472;
    --amber:#FFB020;
    --amber-dim:rgba(255,176,32,.16);
    --red:#E5514F;
    --green:#33A17A;
    --blue:#4C8DC9;
    --blue-dim:rgba(76,141,201,.18);
  }

  html, body, #viewDiv {
    width: 100%;
    height: 100% !important;
    margin: 0;
    padding: 0;
  }

  #loader {
    position: absolute;
    inset: 0;
    z-index: 60;
  }

  .Legend-container {
    position: absolute;
    top: 80px;
    left: 70px;
    z-index: 25;
    width: 350px;
    max-height: 500px;
    overflow: auto;
    display: none;
  }

  .Basemap-container,
  .Print-container {
    position: absolute;
    top: 80px;
    left: 70px;
    z-index: 25;
    width: 500px;
    max-height: 500px;
    overflow-y: auto;
    display: none;
  }

  .layer-list-container {
    position: absolute;
    top: 80px;
    left: 70px;
    z-index: 25;
    width: 240px;
    max-height: 500px;
    overflow-y: auto;
    text-align: right;
    display: none;
  }

  body {
    font-family: "IBM Plex Sans Arabic", Tahoma, Arial, sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 85% -15%, rgba(255,176,32,.12), transparent 60%),
      radial-gradient(ellipse 900px 700px at 5% 0%, rgba(76,141,201,.10), transparent 60%),
      var(--bg);
    color: var(--text);
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }

  #loader {
    background: rgba(14,18,23,.95) !important;
    color: var(--text) !important;
  }

  .gate-screen {
    position: absolute;
    inset: 0;
    z-index: 120;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(9, 13, 18, .96);
  }

  .gate-card {
    width: min(560px, 96vw);
    background: linear-gradient(165deg, rgba(22,27,34,.98), rgba(28,35,44,.96));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 20px 36px rgba(0,0,0,.42);
    text-align: right;
  }

  .gate-card h2 {
    margin: 0 0 8px;
    font-family: "Tajawal", "IBM Plex Sans Arabic", sans-serif;
    font-size: 24px;
    color: var(--text);
  }

  .gate-card p {
    margin: 0 0 14px;
    color: var(--text-muted);
    line-height: 1.9;
    font-size: 14px;
  }

  .gate-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .gate-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 800;
    text-decoration: none;
    border: 1px solid transparent;
    font-family: "IBM Plex Sans Arabic", sans-serif;
  }

  .gate-btn.primary {
    color: #14181e;
    background: var(--amber);
  }

  .gate-btn.secondary {
    color: var(--text);
    border-color: var(--border);
    background: transparent;
  }

  .topbar {
    position: absolute;
    top: 14px;
    right: 16px;
    z-index: 30;
    background: linear-gradient(160deg, rgba(22,27,34,.94), rgba(28,35,44,.92));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 14px;
    box-shadow: 0 12px 28px rgba(0,0,0,.35);
    display: flex;
    align-items: center;
    gap: 12px;
    backdrop-filter: blur(8px);
  }

  /* Keep the right panel below the title bar to avoid overlap */
  .esri-ui-top-right .search-panel {
    margin-top: 72px !important;
  }

  .topbar strong {
    font-family: "Tajawal", "IBM Plex Sans Arabic", sans-serif;
    font-size: 16px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: .005em;
  }

  .topbar a {
    font-family: "IBM Plex Sans Arabic", sans-serif;
    color: #14181e;
    text-decoration: none;
    font-weight: 800;
    font-size: 12px;
    background: var(--amber);
    border-radius: 999px;
    padding: 5px 11px;
    transition: transform .18s ease, box-shadow .18s ease;
  }

  .topbar a:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(255,176,32,.28);
  }

  .mapIcons {
    color: #A9B2BE !important;
    background: rgba(22,27,34,.9) !important;
    border: 1px solid #3A4551 !important;
    border-radius: 10px !important;
    width: 35px !important;
    height: 35px !important;
    box-shadow: 0 4px 10px rgba(0,0,0,.28);
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    font-size: 0 !important;
  }

  .mapIcons:hover {
    border-color: #566272 !important;
    color: #D2D8E0 !important;
    background: rgba(28,34,42,.98) !important;
  }

  .mapIcons.active {
    border-color: #6A7788 !important;
    color: #E1E6ED !important;
    background: rgba(34,41,50,.98) !important;
  }

  /* Monochrome fallback icons if Esri icon font is unavailable */
  #layersButton::before,
  #LegedButton::before,
  #BasemapButton::before,
  #PrintButton::before,
  #areaButton::before,
  #distanceButton::before {
    font-size: 15px;
    line-height: 1;
    font-family: "Segoe UI Symbol", "Segoe UI", sans-serif;
    color: inherit;
  }

  #layersButton::before { content: "≡"; }
  #LegedButton::before { content: "◫"; }
  #BasemapButton::before { content: "▦"; }
  #PrintButton::before { content: "⎙"; }
  #areaButton::before { content: "□"; }
  #distanceButton::before { content: "↔"; }

  .widgetsBox,
  .Legend-container,
  .layer-list-container,
  .Basemap-container,
  .Print-container {
    color: var(--text) !important;
    background: rgba(22,27,34,.96) !important;
    border: 1px solid var(--border) !important;
    border-radius: 12px !important;
    box-shadow: 0 10px 26px rgba(0,0,0,.34) !important;
    backdrop-filter: blur(8px);
  }

  .Widget-title {
    color: var(--amber) !important;
    font-weight: 800 !important;
    padding: 10px 12px 8px !important;
    border-bottom: 1px solid var(--border-soft);
    margin-bottom: 0 !important;
  }

  .widget-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border-soft);
  }

  .widget-head .Widget-title {
    padding: 0 !important;
    border-bottom: none !important;
    margin: 0 !important;
    font-size: 13px;
  }

  .widget-close {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: #11161D;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .widget-close:hover {
    border-color: var(--amber);
    color: var(--amber);
  }

  .search-panel {
    background: linear-gradient(170deg, rgba(22,27,34,.96), rgba(28,35,44,.95)) !important;
    border: 1px solid var(--border) !important;
    border-radius: 14px !important;
    box-shadow: 0 18px 38px rgba(0,0,0,.38) !important;
    color: var(--text) !important;
    padding: 10px 10px 9px !important;
    width: 278px !important;
    max-width: min(86vw, 278px) !important;
    max-height: calc(100vh - 104px) !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
  }

  .search-panel::-webkit-scrollbar { width: 6px; }
  .search-panel::-webkit-scrollbar-track { background: rgba(255,255,255,.05); border-radius: 999px; }
  .search-panel::-webkit-scrollbar-thumb { background: rgba(255,176,32,.45); border-radius: 999px; }

  .search-panel p {
    margin: 0 0 8px;
    color: var(--text);
    font-family: "Tajawal", "IBM Plex Sans Arabic", sans-serif;
    font-weight: 800;
    font-size: 14px;
  }

  .search-panel .row { margin-bottom: 7px; }

  .report-row {
    width: 100%;
    display: block;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--border-soft);
  }

  #SearchCard > .row:not(.report-row) {
    width: calc(50% - 4px);
    display: inline-block;
    vertical-align: top;
  }

  .search-panel label {
    display: block;
    font-size: 11.5px;
    color: var(--text-muted);
    font-weight: 700;
    width: 100%;
    line-height: 1.35;
  }

  .search-panel input,
  .search-panel select,
  .period-select {
    width: 100%;
    margin-top: 4px;
    padding: 7px 8px;
    border: 1px solid var(--border) !important;
    border-radius: 8px;
    color: var(--text);
    background: #11161D !important;
    font-family: "IBM Plex Sans Arabic", sans-serif;
    font-size: 12px;
    font-weight: 500;
    box-sizing: border-box;
  }

  #autocomplete::placeholder {
    font-size: 11px;
    color: var(--text-faint);
  }

  .search-panel input:focus,
  .search-panel select:focus,
  .period-select:focus {
    outline: none;
    border-color: var(--amber) !important;
    box-shadow: 0 0 0 2px rgba(255,176,32,.18);
  }

  .period-selector-wrapper { margin-bottom: 6px; position: relative; }

  .period-toggle-link {
    font-family: "IBM Plex Sans Arabic", sans-serif;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 9px;
    background: linear-gradient(135deg, rgba(76,141,201,.28), rgba(76,141,201,.15));
    color: #DCEBFA;
    border: 1px solid rgba(76,141,201,.45);
    border-radius: 10px;
    text-decoration: none;
    font-size: 12px;
    font-weight: 700;
  }

  .period-arrow { margin-right: auto; font-size: 11px; transition: transform .25s; }
  .period-arrow.open { transform: rotate(180deg); }

  .period-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 7px);
    right: 0;
    left: 0;
    background: #131922;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 10px 20px rgba(0,0,0,.35);
    z-index: 9999;
  }

  .period-dropdown.open { display: block; }

  .period-dropdown-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    gap: 8px;
  }

  .period-dropdown-row.year-row {
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
  }

  .period-label-text { font-size: 12px; font-weight: 700; color: var(--text-muted); min-width: 38px; }

  .period-dropdown-row.year-row .period-label-text {
    min-width: 0;
  }

  .year-multiselect-wrapper { position: relative; flex: 1; width: 100%; }

  .year-multi-toggle {
    font-family: "IBM Plex Sans Arabic", sans-serif;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    text-align: right;
    background: #10151C;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 12.5px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .year-multi-toggle::after {
    content: "▾";
    color: var(--text-faint);
    font-size: 11px;
    margin-inline-start: 8px;
    flex-shrink: 0;
  }

  .year-multi-toggle:hover { border-color: #566272; }

  .year-multi-list {
    display: none;
    position: absolute;
    top: calc(100% + 5px);
    right: 0;
    left: 0;
    background: #10151C;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    max-height: min(42vh, 300px);
    overflow-y: auto;
    z-index: 30;
    box-shadow: 0 10px 18px rgba(0,0,0,.35);
    scrollbar-width: thin;
    scrollbar-color: rgba(255,176,32,.75) rgba(255,255,255,.08);
  }

  .year-multi-list.open { display: block; }

  .year-multi-list::-webkit-scrollbar { width: 8px; }

  .year-multi-list::-webkit-scrollbar-track {
    background: rgba(255,255,255,.06);
    border-radius: 999px;
  }

  .year-multi-list::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, rgba(255,176,32,.95), rgba(208,138,27,.9));
    border-radius: 999px;
  }

  .year-multi-list::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, rgba(255,191,68,1), rgba(221,150,34,1));
  }

  .year-option {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--text);
    padding: 7px 8px;
    border-radius: 6px;
    cursor: pointer;
  }

  .year-option:hover {
    color: var(--amber);
    background: rgba(255,176,32,.08);
  }

  .year-option input[type="checkbox"] {
    accent-color: var(--amber);
    width: 14px;
    height: 14px;
    cursor: pointer;
  }

  .year-option-all { font-weight: 700; }

  .year-option-all {
    position: sticky;
    top: -8px;
    background: #10151C;
    z-index: 1;
  }

  .year-option-sep {
    border: none;
    border-top: 1px solid var(--border-soft);
    margin: 4px 0;
  }

  .period-apply-btn {
    font-family: "IBM Plex Sans Arabic", sans-serif;
    width: 100%;
    padding: 8px;
    background: linear-gradient(135deg, #D08A1B, #FFB020);
    color: #14181e;
    border: none;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 800;
    cursor: pointer;
  }

  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 7px;
    width: 100%;
    clear: both;
  }

  .btn-row button {
    font-family: "IBM Plex Sans Arabic", sans-serif;
    flex: 1;
    border: 1px solid transparent;
    border-radius: 9px;
    padding: 8px 7px;
    cursor: pointer;
    font-weight: 800;
    color: #14181e;
    background: var(--amber);
    transition: transform .14s ease;
  }

  .btn-row button:hover { transform: translateY(-1px); }

  .btn-row button:last-child {
    color: var(--text);
    background: transparent;
    border-color: var(--border);
  }

  .search-panel hr {
    border: none;
    border-top: 1px solid var(--border-soft);
    margin: 8px 0;
    clear: both;
  }

  .stats-scroll-area {
    overflow-y: auto;
    max-height: 124px;
    margin-top: 6px;
    padding-right: 2px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,176,32,.65) rgba(255,255,255,.06);
  }

  .stats-scroll-area::-webkit-scrollbar { width: 7px; }
  .stats-scroll-area::-webkit-scrollbar-track { background: rgba(255,255,255,.06); border-radius: 10px; }
  .stats-scroll-area::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, rgba(255,176,32,.9), rgba(229,81,79,.85));
    border-radius: 10px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    margin-top: 6px;
  }

  #statsPanel {
    position: relative;
    min-height: 86px;
  }

  .stats-loader {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 6px;
    background: rgba(16, 21, 28, .72);
    backdrop-filter: blur(2px);
    border-radius: 9px;
    z-index: 5;
  }

  #statsPanel.is-loading .stats-loader { display: flex; }

  .stats-loader-spinner {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255,255,255,.2);
    border-top-color: var(--amber);
    border-radius: 50%;
    animation: stats-spin .75s linear infinite;
  }

  .stats-loader-text {
    font-size: 10.5px;
    color: var(--text-muted);
    font-weight: 700;
  }

  @keyframes stats-spin {
    to { transform: rotate(360deg); }
  }

  .stat-card {
    border-radius: 9px;
    padding: 7px 4px;
    text-align: center;
    background: linear-gradient(180deg, #1B2430 0%, #18202A 100%);
    border: 1px solid var(--border);
  }

  .stat-value {
    font-size: 12px;
    font-weight: 800;
    color: var(--blue);
    font-family: "IBM Plex Sans Arabic", "Tajawal", Tahoma, Arial, sans-serif;
    font-variant-numeric: tabular-nums;
    letter-spacing: .01em;
  }

  .stat-label {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 3px;
    font-weight: 600;
  }

  .stat-total .stat-value { color: var(--amber); font-size: 13px; }
  .stat-dead .stat-value { color: var(--red); }
  .stat-injuries .stat-value { color: #EC7C4B; }
  .stat-damages .stat-value { color: #9B7ED9; }
  .stat-vehicles .stat-value { color: var(--green); }
  .stat-cost .stat-value { color: #D7DDE6; font-size: 10.8px; }

  #search-lable {
    display: none;
    margin-bottom: 6px;
    color: var(--text-muted);
    font-size: 11px;
  }

  .esri-popup,
  .esri-popup__main-container,
  .esri-widget,
  .esri-menu,
  .esri-search,
  .esri-component {
    font-family: "IBM Plex Sans Arabic", Tahoma, Arial, sans-serif !important;
  }

  .esri-search__input,
  .esri-input,
  .esri-select {
    font-family: "IBM Plex Sans Arabic", sans-serif !important;
    font-size: 13px !important;
  }

  .esri-widget__heading,
  .esri-popup__header-title {
    font-family: "Tajawal", "IBM Plex Sans Arabic", sans-serif !important;
    font-weight: 800 !important;
  }

  @media (max-width: 900px) {
    .topbar {
      top: 10px;
      right: 10px;
      left: 10px;
      justify-content: space-between;
      padding: 9px 10px;
    }

    .topbar strong { font-size: 12.5px; }
    .topbar a { font-size: 11.5px; padding: 5px 10px; }

    .search-panel {
      width: min(88vw, 292px) !important;
      max-width: min(88vw, 292px) !important;
      max-height: calc(100vh - 96px) !important;
    }

    .esri-ui-top-right .search-panel {
      margin-top: 82px !important;
    }

    #SearchCard > .row:not(.report-row) {
      width: 100%;
      display: block;
    }

    .stats-scroll-area { max-height: 130px; }

    .year-multi-list {
      max-height: min(34vh, 260px);
    }
  }
</style>
</head>
<body>
<calcite-loader id="loader" text="جاري تحميل الخريطة" active></calcite-loader>
<div class="topbar">
  <strong>مستكشف الحوادث الجغرافي</strong>
  <a href="index.html">العودة للرئيسية</a>
</div>

<button class="action-button esri-icon-layers mapIcons" id="layersButton" type="button" title="الطبقات"></button>
<button class="action-button esri-icon-legend mapIcons" id="LegedButton" type="button" title="مفتاح الخريطة"></button>
<button class="action-button esri-icon-basemap mapIcons" id="BasemapButton" type="button" title="خرائط الاساس"></button>
<button class="action-button esri-icon-printer mapIcons" id="PrintButton" type="button" title="طباعة الخريطة"></button>
<button class="action-button esri-icon-measure-area mapIcons" id="areaButton" type="button" title="قياس المساحات"></button>
<button class="action-button esri-icon-measure-line mapIcons" id="distanceButton" type="button" title="قياس الاطوال"></button>

<div class="Legend-container widgetsBox" id="Legend-container">
  <div class="widget-head">
    <div class="Widget-title">مفتاح الخريطة</div>
    <button id="closeLegend" class="widget-close" type="button" aria-label="إغلاق نافذة مفتاح الخريطة">×</button>
  </div>
  <div id="LegendContainer"></div>
</div>
<div class="layer-list-container widgetsBox" id="layer-list-container">
  <div class="widget-head">
    <div class="Widget-title">طبقات الخريطة</div>
    <button id="closeLayerList" class="widget-close" type="button" aria-label="إغلاق نافذة طبقات الخريطة">×</button>
  </div>
  <div id="layerListContainer" class="layerListContainer widgetsBox"></div>
</div>
<div class="Basemap-container widgetsBox" id="Basemap-container">
  <div class="widget-head">
    <div class="Widget-title">خرائط الاساس</div>
    <button id="closeBasemap" class="widget-close" type="button" aria-label="إغلاق نافذة خرائط الأساس">×</button>
  </div>
  <div id="BasemapContainer"></div>
</div>
<div class="Print-container widgetsBox" id="Print-container">

  function togglePeriodDropdown(e) {
    e.preventDefault();

    var isOpen = dropdown.classList.contains('open');

    if (wrapper && !wrapper.contains(e.target)) {
      document.getElementById('periodDropdown').classList.remove('open');

  });

  function toSafeNumber(value) {
    if (value === null || value === undefined || value === "") return 0;
    if (typeof value === "number") return Number.isFinite(value) ? value : 0;
    var normalized = String(value)
      .replace(/[\u0660-\u0669]/g, function (d) { return String(d.charCodeAt(0) - 1632); })
      .replace(/[\u06F0-\u06F9]/g, function (d) { return String(d.charCodeAt(0) - 1776); })
      .replace(/[−–—]/g, '-')
      .replace(/[\s\u00A0]/g, '')
      .replace(/(ر\.س|ريال|sar|SAR)/g, '')
      .replace(/[^0-9.,-]/g, '');

    if (!normalized) return 0;

    var lastDot = normalized.lastIndexOf('.');
    var lastComma = normalized.lastIndexOf(',');
    var decimalIndex = Math.max(lastDot, lastComma);

    if (decimalIndex > -1) {
      var intPart = normalized.slice(0, decimalIndex).replace(/[.,]/g, '');
      var fracPart = normalized.slice(decimalIndex + 1).replace(/[.,]/g, '');
      normalized = intPart + (fracPart ? '.' + fracPart : '');
    } else {
      normalized = normalized.replace(/[.,]/g, '');
    }

    if ((normalized.match(/-/g) || []).length > 1) {
      normalized = normalized.replace(/-/g, '');
    }

    if (normalized.indexOf('-') > 0) {
      normalized = normalized.replace(/-/g, '');
    }
    var parsed = Number(normalized);
    return Number.isFinite(parsed) ? parsed : 0;
  }

  function updateResultStats(features) {
    var total = features.length;
    var deadSum = 0, injuriesSum = 0, damagesSum = 0, costSum = 0, vehiclesSum = 0;
    features.forEach(function(f) {
      var attrs = (f && f.attributes) || {};
      deadSum += toSafeNumber(attrs.DeadNumber);
      injuriesSum += toSafeNumber(attrs.InjuriesNumber);
      damagesSum += toSafeNumber(attrs.DamagesNumber);
      costSum += toSafeNumber(attrs.Costaccident);
      vehiclesSum += toSafeNumber(attrs.VehiclesNumber);
    });

    document.getElementById('stat-total').innerText = total.toLocaleString('ar-SA');
    document.getElementById('stat-dead').innerText = Math.round(deadSum).toLocaleString('ar-SA');
    document.getElementById('stat-injuries').innerText = Math.round(injuriesSum).toLocaleString('ar-SA');
    document.getElementById('stat-damages').innerText = Math.round(damagesSum).toLocaleString('ar-SA');
    document.getElementById('stat-cost').innerText = Math.round(costSum).toLocaleString('ar-SA');
    document.getElementById('stat-vehicles').innerText = Math.round(vehiclesSum).toLocaleString('ar-SA');
  }

  function renderStatsFromValues(total, deadSum, injuriesSum, damagesSum, costSum, vehiclesSum) {
    document.getElementById('stat-total').innerText = Math.round(total || 0).toLocaleString('ar-SA');
    document.getElementById('stat-dead').innerText = Math.round(deadSum || 0).toLocaleString('ar-SA');
    document.getElementById('stat-injuries').innerText = Math.round(injuriesSum || 0).toLocaleString('ar-SA');

    document.getElementById('stat-cost').innerText = Math.round(costSum || 0).toLocaleString('ar-SA');
    document.getElementById('stat-vehicles').innerText = Math.round(vehiclesSum || 0).toLocaleString('ar-SA');
  }

  require([
    "esri/intl", "esri/Map", "esri/Basemap", "esri/views/MapView", "esri/widgets/Home",
    "esri/widgets/Search", "esri/widgets/BasemapGallery", "esri/widgets/LayerList", "esri/layers/WebTileLayer",
    "esri/widgets/Legend", "esri/widgets/DistanceMeasurement2D", "esri/widgets/AreaMeasurement2D",
    "esri/widgets/Print", "esri/widgets/Compass", "esri/geometry/Multipoint", "esri/layers/GraphicsLayer", "custom/main"
  ], function (
    intl, Map, Basemap, MapView, Home, Search, BasemapGallery, LayerList, WebTileLayer,
    Legend, DistanceMeasurement2D, AreaMeasurement2D, Print, Compass, Multipoint, GraphicsLayer, main
  ) {
    async function initMap() {
      var PeriodwhereClause = '1=1';
      var statsLoadingCounter = 0;
      intl.setLocale("ar");

      const googleLayer = new WebTileLayer({
        urlTemplate: "https://mt1.google.com/vt/lyrs=s&x={col}&y={row}&z={level}",
        copyright: "© Google"
      });
      const googleLabels = new WebTileLayer({
        urlTemplate: "https://mt1.google.com/vt/lyrs=h&x={col}&y={row}&z={level}",
        copyright: "© Google",
        minScale: 30000,
        maxScale: 0
      });
      const googleBasemap = new Basemap({
        baseLayers: [googleLayer, googleLabels],
        title: "خرائط جووجل",
        id: "googleBasemap"
      });

      const map = new Map({ basemap: googleBasemap });

      var AccidenPoints = await main.Initiat_Accident_Points();
      var AdministrationBorder = await main.Initiat_AdministrationBoarder();
      var Roads = await main.Initiat_Roads();
      map.add(AdministrationBorder);
      map.add(Roads);
      map.add(AccidenPoints);

      function setStatsLoading(isLoading) {
        var panel = document.getElementById('statsPanel');
        if (!panel) return;
        if (isLoading) {
          statsLoadingCounter += 1;
        } else {
          statsLoadingCounter = Math.max(0, statsLoadingCounter - 1);
        }
        panel.classList.toggle('is-loading', statsLoadingCounter > 0);
      }

      async function updateStatsForWhere(whereClause) {
        setStatsLoading(true);
        var countQuery = AccidenPoints.createQuery();
        countQuery.where = whereClause || "1=1";

        try {
          var total = await AccidenPoints.queryFeatureCount(countQuery);

          var oidQuery = AccidenPoints.createQuery();
          oidQuery.where = whereClause || "1=1";
          var objectIds = await AccidenPoints.queryObjectIds(oidQuery);

          if (!objectIds || objectIds.length === 0) {
            renderStatsFromValues(total, 0, 0, 0, 0, 0);
            return;
          }

          var deadSum = 0;
          var injuriesSum = 0;
          var damagesSum = 0;
          var costSum = 0;
          var vehiclesSum = 0;
          var chunkSize = 800;

          for (var i = 0; i < objectIds.length; i += chunkSize) {
            var chunk = objectIds.slice(i, i + chunkSize);
            var chunkQuery = AccidenPoints.createQuery();
            chunkQuery.objectIds = chunk;
            chunkQuery.returnGeometry = false;
            chunkQuery.outFields = ['DeadNumber', 'InjuriesNumber', 'DamagesNumber', 'Costaccident', 'VehiclesNumber'];

            var chunkRes = await AccidenPoints.queryFeatures(chunkQuery);
            var chunkFeatures = (chunkRes && chunkRes.features) || [];

            chunkFeatures.forEach(function (f) {
              var attrs = (f && f.attributes) || {};
              deadSum += toSafeNumber(attrs.DeadNumber);
              injuriesSum += toSafeNumber(attrs.InjuriesNumber);
              damagesSum += toSafeNumber(attrs.DamagesNumber);
              costSum += toSafeNumber(attrs.Costaccident);
              vehiclesSum += toSafeNumber(attrs.VehiclesNumber);
            });
          }

          renderStatsFromValues(
            total,
            deadSum,
            injuriesSum,
            damagesSum,
            costSum,
            vehiclesSum

            where: whereClause || "1=1",
            outFields: ['DeadNumber', 'InjuriesNumber', 'DamagesNumber', 'Costaccident', 'VehiclesNumber'],

      function getSelectedYears() {
        return yearCheckboxes
          .filter(function (cb) { return cb.checked; })
          .map(function (cb) { return parseInt(cb.value, 10); });
      }

      function setSelectedYears(years) {
        yearCheckboxes.forEach(function (cb) {
          cb.checked = years.indexOf(parseInt(cb.value, 10)) !== -1;
        });
        yearAllCheckbox.checked = years.length === 0;
        updateYearToggleLabel();
      }

      function updateYearToggleLabel() {
        var selected = getSelectedYears();
        if (selected.length === 0) {
          yearMultiToggle.innerText = 'كل السنوات';
        } else if (selected.length === 1) {
          yearMultiToggle.innerText = String(selected[0]);
        } else {
          yearMultiToggle.innerText = selected.length + ' سنوات محددة';
        }
      }

      yearAllCheckbox.addEventListener('change', function () {
        if (this.checked) {
          yearCheckboxes.forEach(function (cb) { cb.checked = false; });
        }
        updateYearToggleLabel();
      });

      yearCheckboxes.forEach(function (cb) {
        cb.addEventListener('change', function () {
          if (this.checked) yearAllCheckbox.checked = false;
          if (getSelectedYears().length === 0) yearAllCheckbox.checked = true;
          updateYearToggleLabel();
        });
      });

      const Region_graphicsLayer = new GraphicsLayer();
      map.add(Region_graphicsLayer);
      Region_graphicsLayer.listMode = "hide";

      const SelectedParcelpoint_graphicsLayer = new GraphicsLayer();
      map.add(SelectedParcelpoint_graphicsLayer);
      SelectedParcelpoint_graphicsLayer.listMode = "hide";

      document.getElementById("AreaSelect").addEventListener("change", function () {
        const value = this.value;
        if (value) {
          main.ZoomToRegion(Region_graphicsLayer, view, AdministrationBorder, value);
        } else {
          homeWidget.go();
          Region_graphicsLayer.removeAll();
        }
      });

      function getSearchWhereClause() {
        var area = document.getElementById('AreaSelect').value;
        var accidentCause = document.getElementById('accident-cause').value;
        var accidentCat = document.getElementById('accident-cat').value;
        var impactType = document.getElementById('Impact-type').value;
        var roadDir = document.getElementById('Road-Dir').value;
        var accidentType = document.getElementById('accident-type').value;

        var q = area ? "RegionName=" + area : "1=1";
        if (accidentCause) q += " and AccidantCause=" + accidentCause;
        if (accidentCat) q += " and Accidantcatogry=" + accidentCat;
        if (accidentType) q += " and AccidentTypeAr=" + accidentType;
        if (roadDir) q += " and HighwayDirectionAr=" + roadDir;
        if (impactType) q += " and ImpactType=" + impactType;

        return PeriodwhereClause + " and " + q;
      }

      document.getElementById('SearchButton').addEventListener('click', function () {
        var reportNo = document.getElementById('autocomplete').value.trim();

        if (reportNo) {
          var reportWhere = "ReportNumber='" + reportNo.replace(/'/g, "''") + "'";
          AccidenPoints.definitionExpression = reportWhere;
          updateStatsForWhere(reportWhere);
          AccidenPoints.queryFeatures().then(function (results) {
            var features = results.features || [];
            if (features.length > 0) {
              view.goTo({ target: features[0].geometry, zoom: 15 });
              view.popup.open({ features: [features[0]], location: features[0].geometry });
            }
          });
          return;
        }

        var query = getSearchWhereClause();
        AccidenPoints.definitionExpression = query;
        AccidenPoints.queryFeatures().then(function (results) {
          var features = results.features || [];
          document.getElementById('search-lable').style.display = 'block';
          updateStatsForWhere(query);
          if (features.length > 0) view.goTo(features.map(function (f) { return f.geometry; }));
        });
      });

      document.getElementById('CancelSearchButton').addEventListener('click', function () {
        document.getElementById('AreaSelect').value = "";
        document.getElementById('accident-cause').value = "";
        document.getElementById('Road-Dir').value = "";
        document.getElementById('accident-type').value = "";
        document.getElementById('accident-cat').value = "";
        document.getElementById('Impact-type').value = "";
        document.getElementById('autocomplete').value = "";

        Region_graphicsLayer.removeAll();
        SelectedParcelpoint_graphicsLayer.removeAll();
        view.popup.close();
        homeWidget.go();
        document.getElementById('search-lable').style.display = 'none';

        AccidenPoints.definitionExpression = PeriodwhereClause;
        updateStatsForWhere(PeriodwhereClause);
      });

      function ApplyPeriodFilter(year) {
        if (year) setSelectedYears([parseInt(year, 10)]);
        var years = getSelectedYears(); // array, e.g. [] = كل السنوات, [2024], or [2024,2025,...]

        var month = document.getElementById('MonthSelect').value;
        var monthNames = {
          '1':'يناير','2':'فبراير','3':'مارس','4':'أبريل','5':'مايو','6':'يونيو',
          '7':'يوليو','8':'أغسطس','9':'سبتمبر','10':'أكتوبر','11':'نوفمبر','12':'ديسمبر'
        };

        var yearLabel = years.length === 0 ? 'كل السنوات'
          : years.length === 1 ? String(years[0])
          : years.join('، ');
        var label = yearLabel + ' — ' + (month ? monthNames[month] : 'كل الأشهر');
        document.getElementById('periodLabel').innerText = label;
        document.getElementById('periodDropdown').classList.remove('open');
        document.getElementById('periodArrow').classList.remove('open');

        if (years.length && month) {
          var m = parseInt(month, 10);
          var nextMonth = m === 12 ? 1 : m + 1;
          var rangeClauses = years.map(function (y) {
            var nextYear = m === 12 ? y + 1 : y;
            var startStr = y + '-' + String(m).padStart(2, '0') + '-01 00:00:00';
            var endStr = nextYear + '-' + String(nextMonth).padStart(2, '0') + '-01 00:00:00';
            return "(AccidentDate >= date '" + startStr + "' AND AccidentDate < date '" + endStr + "')";
          });
          PeriodwhereClause = rangeClauses.join(' OR ');
        } else if (years.length) {
          PeriodwhereClause = "EXTRACT(YEAR FROM AccidentDate) IN (" + years.join(',') + ")";
        } else if (month) {
          PeriodwhereClause = "EXTRACT(MONTH FROM AccidentDate) = " + parseInt(month, 10);
        } else {
          PeriodwhereClause = '1=1';
        }

        AccidenPoints.definitionExpression = PeriodwhereClause;
        document.getElementById('search-lable').style.display = 'block';
        updateStatsForWhere(PeriodwhereClause);
      }

      document.getElementById('btnpreiodFilter').addEventListener('click', function () {
        ApplyPeriodFilter();
      });

      Promise.all(map.layers.map(function(layer) { return layer.when(); }))
        .then(function () {
          document.getElementById("loader").hidden = true;
          document.getElementById("viewDiv").hidden = false;
          document.getElementById("SearchCard").hidden = false;
          ApplyPeriodFilter(2026);
        })
        .catch(function () {
          // Fallback: show UI even if one layer fails on public host.
          document.getElementById("loader").hidden = true;
          document.getElementById("viewDiv").hidden = false;
          document.getElementById("SearchCard").hidden = false;
        });

      // Build report-number suggestions for quick search.
      AccidenPoints.queryFeatures({
        where: "1=1",
        outFields: ["ReportNumber"],
        returnDistinctValues: true,
        orderByFields: ["ReportNumber DESC"],
        maxRecordCountFactor: 5
      }).then(function (res) {
        var list = document.getElementById('reportNumberList');
        var values = (res.features || []).map(function (f) { return f.attributes.ReportNumber; }).filter(Boolean).slice(0, 1200);
        list.innerHTML = values.map(function (v) { return '<option value="' + String(v).replace(/"/g, '&quot;') + '"></option>'; }).join('');
      }).catch(function () {
        // Ignore suggestions errors because search still works manually.
      });
    }

    initMap();
  });
</script>
</body>
</html>
